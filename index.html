const ACTIVITY_KEY = "arabic_activity_log_v1";
function loadActivity(){try{const r=localStorage.getItem(ACTIVITY_KEY);if(r)return JSON.parse(r);}catch(e){}return{sessions:[],streak:0,lastDate:null};}
function saveActivity(a){try{localStorage.setItem(ACTIVITY_KEY,JSON.stringify(a));}catch(e){}}
function logSession(type){
  const act=loadActivity();
  const today=new Date().toISOString().slice(0,10);
  act.sessions.push({date:today,type,ts:Date.now()});
  if(act.lastDate===today){/* already counted */}
  else{
    const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
    act.streak=(act.lastDate===yesterday)?act.streak+1:1;
  }
  act.lastDate=today;
  saveActivity(act);
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}
function failedVerbs(){return verbs.filter(v=>(stats[v.en]||{}).fails>0);}
function makeDir(){return direction==="mix"?(Math.random()>.5?"ar→en":"en→ar"):direction;}

function speakAr(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ar-SA";u.rate=0.85;
  const v=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith("ar"));
  if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}

function buildNormalDeck(){
  const pool=shuffle(verbs).slice(0,cardCount);
  const w=[];
  pool.forEach(v=>{
    const f=(stats[v.en]||{}).fails||0;
    w.push(v);
    if(f>=2)w.push(v);
    if(f>=5)w.push(v);
  });
  return shuffle(w).map(v=>({verb:v,dir:makeDir()}));
}
function buildDrillDeck(){
  return shuffle(failedVerbs()).map(v=>({verb:v,dir:makeDir()}));
}

  currentScreen=id;
  window.scrollTo(0,0);
}

// ── ARABIC BLOCK ──────────────────────────────────────────────────────────
function arabicBlock(verb, color){
  const showP = tenseMode!=="past", showPa = tenseMode!=="present";
  const c = color||"#fff";
  let html = '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">';
  if(showP){
    html+=`<div class="ar-box-present">
      <div class="badge-present">مضارع · Present</div>
      <div class="ar" style="font-size:42px;color:${c};line-height:1.4;margin-top:8px">${verb.present}</div>
      <button class="speak-btn" style="color:#f9d423" onclick='speakAr(${JSON.stringify(verb.present)});this.textContent="🔊";setTimeout(()=>this.textContent="🔈",1800)'>🔈</button>
    </div>`;
  }
  if(showPa){
    html+=`<div class="ar-box-past">
      <div class="badge-past">ماضي · Past</div>
      <div class="ar" style="font-size:42px;color:${c};line-height:1.4;margin-top:8px">${verb.past}</div>
      <button class="speak-btn" style="color:#ff4e50" onclick='speakAr(${JSON.stringify(verb.past)});this.textContent="🔊";setTimeout(()=>this.textContent="🔈",1800)'>🔈</button>
    </div>`;
  }
  html+='</div>';
  return html;
}

// GAME
// ══════════════════════════════════════════════════════════════════════════
function startGame(drill){
  isDrill=drill;
  deck = drill ? buildDrillDeck() : buildNormalDeck();
  if(deck.length===0){renderMenu();return;}
  deckIdx=0;flipped=false;
  showScreen("game");renderCard();
}
function startDrill(){
  if(failedVerbs().length===0)return;
  startGame(true);
}

function renderCard(){
  const el=document.getElementById("screen-game");
  if(deckIdx>=deck.length){renderGameDone();return;}
  const card=deck[deckIdx];
  const isAr=card.dir==="ar→en";
  const pct=(deckIdx/deck.length)*100;

  let toastHtml="";
  if(isDrill){
    toastHtml=`<div style="margin-bottom:10px;padding:4px 14px;border-radius:20px;font-size:12px;letter-spacing:1px;border:1px solid #f87171;color:#f87171;text-transform:uppercase;display:inline-block">🔥 Mode errors</div>`;
  }

  const frontHtml = isAr
    ? arabicBlock(card.verb)
    : `<div style="text-align:center"><p style="font-size:34px;margin:0;font-style:italic;line-height:1.3">${card.verb.en}</p></div>`;

  const backHtml = flipped
    ? (isAr
        ? `<div style="margin-top:20px;border-top:2px solid #2a2a2a;padding-top:18px;text-align:center"><p style="font-size:32px;margin:0;color:#f9d423;font-style:italic">${card.verb.en}</p></div>`
        : `<div style="margin-top:24px;border-top:2px solid #2a2a2a;padding-top:22px">${arabicBlock(card.verb,"#f9d423")}</div>`)
    : `<p style="color:#555;font-size:15px;text-align:center;margin-top:20px">toca per veure ${isAr?"la traducció":"l'àrab"}</p>`;

  const btnsHtml = flipped
    ? `<div style="display:flex;gap:16px;margin-top:22px"><button class="btn-no" onclick="answer(false)">✗</button><button class="btn-yes" onclick="answer(true)">✓</button></div>`
    : `<div style="margin-top:24px;display:flex;gap:10px;justify-content:center">
        <div style="width:10px;height:10px;border-radius:50%;background:#444"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#f9d423;animation:pulse 1.5s infinite"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#444"></div>
       </div>`;

  el.innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div class="wrap" style="padding-left:0;padding-right:0">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <button onclick="showScreen('menu');renderMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>
        <div class="grad-bar" style="flex:1"><div class="grad-bar-fill" style="width:${pct}%"></div></div>
        <span style="color:#888;font-size:17px">${deckIdx+1}/${deck.length}</span>
      </div>
      <div style="text-align:center;margin-bottom:12px">${toastHtml}</div>
      <div class="card" onclick="flipCard()" style="cursor:${flipped?'default':'pointer'}">
        ${frontHtml}${backHtml}
      </div>
      ${btnsHtml}
    </div>
  </div>`;
}

function flipCard(){
  if(!flipped){flipped=true;renderCard();}
}

function answer(correct){
  const verb=deck[deckIdx].verb;
  let graduated=false;
  const e=stats[verb.en]||{fails:0,streak:0};
  if(isDrill){
    const newStreak=correct?e.streak+1:0;
    if(newStreak>=3){graduated=true;stats[verb.en]={fails:0,streak:0};}
    else stats[verb.en]={fails:correct?e.fails:e.fails+1,streak:newStreak};
  } else {
    stats[verb.en]={fails:correct?e.fails:e.fails+1,streak:correct?e.streak:0};
  }
  saveStats(stats);

  if(graduated){
    // brief flash
    const el=document.getElementById("screen-game");
    const toast=document.createElement("div");
    toast.textContent=`🎓 "${verb.en}" graduada!`;
    toast.style.cssText="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(74,222,128,.2);border:1px solid #4ade80;border-radius:20px;padding:10px 20px;color:#4ade80;font-size:14px;z-index:999;animation:popIn .3s ease";
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),1500);
  }

  deckIdx++;
  flipped=false;
  if(deckIdx>=deck.length)renderGameDone();
  else renderCard();
}

function renderGameDone(){
  logSession(isDrill?'drill':'flashcards');
  document.getElementById("screen-game").innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
    <div style="font-size:72px">✅</div>
    <h2 style="font-size:32px;margin:16px 0 8px;color:#f9d423">Sessió completada!</h2>
    <p style="color:#aaa;font-size:18px">${deck.length} cartes fetes</p>
    <button onclick="showScreen('menu');renderMenu()" style="margin-top:28px;padding:16px 36px;border-radius:16px;border:none;background:linear-gradient(90deg,#f9d423,#ff4e50);color:#1a1a2e;font-weight:700;font-size:18px;cursor:pointer">← Menú</button>
  </div>`;
}

function submitApiKey(){
  const inp = document.getElementById("api-key-input");
  const key = inp ? inp.value.trim() : "";
  if(!key.startsWith("sk-")){
    inp.style.border = "1px solid #f87171";
    inp.placeholder = "Ha de començar per sk-...";
    return;
  }
  saveApiKey(key);
  renderAIMenu();
}

async function callAI(system, user, history){
  const key = getApiKey();
  if(!key){ renderApiKeyScreen(); throw new Error("No API key"); }
  const msgs = history ? history : [{role:"user", content:user}];
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body:JSON.stringify({
      model:"claude-haiku-4-5-20251001",
      max_tokens:4096,
      system:system,
      messages:msgs
    })
  });
  if(resp.status===401){
    clearApiKey();
    renderApiKeyScreen();
    throw new Error("Clau invàlida. Comprova-la a console.anthropic.com");
  }
  const data = await resp.json();
  if(data.error){ throw new Error(data.error.message); }
  return data.content?.[0]?.text || "";
}

async function generateStory(themeId){
  currentStoryTheme = themeId;
  currentActivity = "story";
  showAILoading("conte");
  const seed = Math.floor(Math.random()*10000);
  const names = ["Khalid","Layla","Yusuf","Sara","Hassan","Nour","Mariam","Tariq","Zainab","Bilal","Rania","Samira","Karim","Lina","Jamal","Hana","Sami","Dina","Walid","Rana","Faris","Mona","Salma","Huda","Rim"];
  const shuffledNames = names.sort(()=>Math.random()-.5);
  const protagonist = shuffledNames[0];
  const secondary = shuffledNames[1];
  let themeInstruction;
  if(themeId === 'random'){
    const randomIdeas = [
      "Un malentès còmic entre dues persones que no parlen el mateix dialecte",
      "Algú es desperta en un lloc que no reconeix",
      "Un regal misteriós arriba sense remitent",
      "Una recepta secreta de l'àvia que ningú pot reproduir",
      "Un animal entra en un lloc inesperat",
      "Dues persones es troben després de molts anys",
      "Un examen amb una pregunta impossible",
      "Una tempesta que canvia els plans de tothom",
      "Un error al telèfon que porta a una aventura",
      "Una competició absurda entre veïns",
      "Un somni que es barreja amb la realitat",
      "Una carta antiga trobada dins d'un llibre",
      "Un viatge en tren amb un company de seient estrany",
      "Un plat cuinat que causa una reacció inesperada",
      "Una visita al metge amb un diagnòstic sorprenent",
      "Un primer dia de feina desastrós",
      "Una festa on tot surt malament",
      "Un secret de família revelat per accident",
      "Una aposta entre amics amb conseqüències inesperades",
      "Un objecte perdut que apareix en el lloc més absurd",
    ];
    const idea = randomIdeas[Math.floor(Math.random()*randomIdeas.length)];
    themeInstruction = `TEMA: Inventa un conte ORIGINAL i CREATIU. Inspiració (NO la copiïs literalment, usa-la com a punt de partida): "${idea}". Seed: ${seed}. Barreja elements de categories diferents del vocabulari.`;
  } else {
    const theme = STORY_THEMES.find(t=>t.id===themeId);
    themeInstruction = `TEMA OBLIGATORI: ${theme.emoji} ${theme.label} — ${theme.desc}. Usa principalment vocabulari de: ${theme.vocab}. Seed: ${seed}.`;
  }
  try{
    const txt = await callAI(
      `Ets un professor d'àrab creatiu. ${VOCAB_SHORT}
Escriu un conte de 4-5 frases en àrab MSA. Vocabulari conegut + màx 1 paraula nova per frase.
${themeInstruction}
Protagonista: ${protagonist}. Personatge secundari: ${secondary}.
REGLES IMPORTANTS:
- NO escriguis MAI sobre taxis, ni sobre conductors de taxi. PROHIBIT.
- El conte ha de ser ÚNIC i DIFERENT cada vegada. Seed aleatòria: ${seed}.
- Final: MAI feliç previsible. Pot ser: sorprenent, ambigu, còmic, trist, irònic, absurd.
- Fes servir TOTS els temps verbals que coneixes: present, passat, futur (سـ), imperatiu.
Respon NOMÉS en JSON sense backticks:
{"theme":"tema del conte en català","sentences":[{"ar":"frase","ca":"traducció","words":[{"ar":"mot","ca":"trad"},...]}]}
Totes les paraules de cada frase han d'aparèixer a "words" en ordre.
IMPORTANT: escriu TOT l'àrab amb vocalització completa (tashkil): fatha َ kasra ِ damma ُ shadda ّ sukun ْ. Sense excepció.`,
      `Genera un conte curt. Seed: ${seed}. Protagonista: ${protagonist}.`
    );
    aiContent = JSON.parse(txt.replace(/```json|```/g,"").trim());
    renderStory();
  }catch(e){
    if(e.message === "No API key" || e.message === "Invalid API key") return;
    document.getElementById("screen-ai-activity").innerHTML=`

  }
}

      wordsHtml = s.words.map(w => {
        const wid = "w_" + Math.random().toString(36).slice(2);

        window._tips[wid] = w.ca;
        return '<span class="ar-word" id="' + wid + '" onclick="toggleWordTip(\'' + wid + '\')">' +
               '<span class="ar-word-text">' + w.ar + '</span>' +
               '<span class="ar-word-tip">' + w.ca + '</span></span>';
      }).join(" ");;

        <h2 style="font-size:20px;color:#a78bfa">📖 Conte generat</h2>
        <button onclick="generateStory(currentStoryTheme||'random')" style="margin-left:auto;padding:8px 14px;border-radius:12px;border:1px solid rgba(167,139,250,.4);background:rgba(167,139,250,.1);color:#a78bfa;font-size:13px;cursor:pointer">🔄 Nou</button>

function toggleWordTip(id){
  const el = document.getElementById(id);
  if(!el) return;
  const isOpen = el.classList.contains("open");
  document.querySelectorAll(".ar-word.open").forEach(w => w.classList.remove("open"));
  if(!isOpen) el.classList.add("open");
}


function renderFill(){
  if(!aiContent||!aiContent.items)return;
  const rows=aiContent.items.map((item,i)=>{
    const chosen=fillAnswers[i];
    const isCorrect=chosen===item.answer;
    const borderColor=fillChecked?(isCorrect?"rgba(74,222,128,.4)":"rgba(248,113,113,.4)"):"rgba(167,139,250,.2)";
    const opts=item.options.map(opt=>{
      let bg="rgba(255,255,255,.05)",border="1px solid #444",color="#aaa";
      if(chosen===opt){bg="rgba(167,139,250,.2)";border="1px solid #a78bfa";color="#a78bfa";}
      if(fillChecked&&opt===item.answer){bg="rgba(74,222,128,.15)";border="1px solid #4ade80";color="#4ade80";}
      if(fillChecked&&chosen===opt&&chosen!==item.answer){bg="rgba(248,113,113,.15)";border="1px solid #f87171";color="#f87171";}
      return `<button onclick="${fillChecked?"":`selectFill(${i},'${opt.replace(/'/g,"\'")}')`}" style="padding:8px 14px;border-radius:10px;border:${border};background:${bg};color:${color};font-family:Arial,sans-serif;font-size:18px;cursor:${fillChecked?"default":"pointer"};direction:rtl">${opt}</button>`;
    }).join("");
    return `<div style="background:rgba(255,255,255,.05);border:1px solid ${borderColor};border-radius:16px;padding:16px 18px">
      <div class="ar" style="font-size:22px;color:#fff;margin-bottom:6px;line-height:1.6">${item.ar}</div>
      <div style="color:#888;font-size:13px;margin-bottom:12px;font-style:italic">${item.ca}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${opts}</div>
    </div>`;
  }).join("");

  const correctCount=Object.entries(fillAnswers).filter(([i,v])=>v===aiContent.items[i].answer).length;
  const checkBtn=fillChecked
    ? `<div style="text-align:center;padding:16px;border-radius:16px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3)"><span style="font-size:24px;color:#a78bfa">${correctCount} / ${aiContent.items.length} correctes</span></div>`
    : `<button onclick="checkFill()" style="padding:16px;border-radius:16px;border:none;background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;font-weight:700;font-size:18px;cursor:pointer;width:100%">Comprovar respostes</button>`;

  document.getElementById("screen-ai-activity").innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div style="max-width:580px;margin:0 auto">
      ${aiHeader("✏️ Omple els buits")}
      <div style="display:flex;flex-direction:column;gap:16px">
        ${rows}
        ${checkBtn}
      </div>
    </div>
  </div>`;
}

function selectFill(i, opt){
  fillAnswers[i]=opt;
  renderFill();
}
function checkFill(){
  fillChecked=true;
  renderFill();
}

let translateRevealed={};
function renderTranslate(){
  if(!aiContent||!aiContent.items)return;
  const rows=aiContent.items.map((item,i)=>{
    const isAr=item.dir==="ar→ca";
    const revealed=translateRevealed[i];
    const fromHtml=isAr
      ? `<div class="ar" style="font-size:26px;color:#fff;line-height:1.5">${item.from}</div>`
      : `<div style="font-size:18px;color:#fff;line-height:1.5;font-style:italic">${item.from}</div>`;
    const toHtml=revealed
      ? (isAr
          ? `<div style="font-size:16px;color:#f9d423;font-style:italic;margin-top:4px">${item.to}</div>`
          : `<div class="ar" style="font-size:26px;color:#f9d423;line-height:1.5;margin-top:4px">${item.to}
              <button onclick='speakAr(${JSON.stringify(item.to)});this.textContent="🔊";setTimeout(()=>this.textContent="🔈",1800)' style="background:none;border:none;color:#a78bfa;font-size:16px;cursor:pointer">🔈</button>
             </div>`)
      : `<button onclick="revealTranslate(${i})" style="margin-top:10px;padding:8px 16px;border-radius:10px;border:1px solid rgba(167,139,250,.4);background:rgba(167,139,250,.1);color:#a78bfa;font-size:14px;cursor:pointer">Veure traducció</button>`;
    return `<div style="background:rgba(255,255,255,.05);border:1px solid rgba(167,139,250,.2);border-radius:16px;padding:16px 18px">
      <div style="font-size:12px;color:#a78bfa;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">${item.dir}</div>
      ${fromHtml}${toHtml}
    </div>`;
  }).join("");

  document.getElementById("screen-ai-activity").innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div style="max-width:580px;margin:0 auto">
      ${aiHeader("🔄 Traducció")}
      <div style="display:flex;flex-direction:column;gap:12px">${rows}</div>
    </div>
  </div>`;
}
function revealTranslate(i){
  translateRevealed[i]=true;
  renderTranslate();
}

function setChatInput(text){
  const inp=document.getElementById("chat-input");
  if(inp)inp.value=text;
}

async function sendChat(){
  const inp=document.getElementById("chat-input");
  if(!inp||!inp.value.trim())return;
  const userText=inp.value.trim();
  chatHistory.push({role:"assistant",text:""});// placeholder
  chatHistory.pop();
  chatHistory.push({role:"user",text:userText});
  renderChat(); // show user message + loading

  const histForAI=chatHistory.map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.text}));
  try{
    const reply=await callAI(
      `Ets un interlocutor àrab amable, pacient i variat. ${VOCAB_CONTEXT}
Conversa en àrab usant vocabulari conegut. Si l'estudiant comet errors, corregeix-los breument i continua.
Format: primera línia en àrab, segona línia traducció al català. Si cal: 💡 Correcció: ...

VARIETAT: cada conversa tingues un rol diferent. Pots ser:
- Un amic àrab que explica el seu dia
- Un venedor al mercat
- Un metge a la consulta
- Un company de classe
- Un hoteler que rep turistes
- Un cuiner que explica una recepta
- Un viatger que demana informació
Introdueix-te breument al primer missatge i mantén el rol durant tota la conversa.
IMPORTANT: escriu TOT l'àrab amb vocalització completa (tashkil): fatha, kasra, damma, shadda, sukun. SEMPRE.`,
      null,
      histForAI
    );
    chatHistory.push({role:"assistant",text:reply});
  }catch(e){
    chatHistory.push({role:"assistant",text:"Error de connexió. Torna-ho a intentar."});
  }
  renderChat();
}

async function startThemedChat(themeId){
  let theme;
  if(themeId === 'random'){
    theme = CONVERSATION_THEMES[Math.floor(Math.random() * CONVERSATION_THEMES.length)];
  } else {
    theme = CONVERSATION_THEMES.find(t => t.id === themeId);
  }
  if(!theme) return;

  chatHistory = [];
  currentActivity = "themed_" + theme.id;
  showAILoading("conversa temàtica");

  const systemPrompt = `Ets un parlant natiu d'àrab en una conversa temàtica amb un estudiant. ${VOCAB_CONTEXT}

TEMA: ${theme.label} (${theme.unit})
SITUACIÓ: ${theme.desc}

ROL: Inicia tu la conversa de manera natural en àrab, presentant-te en el rol adequat (venedor, metge, company...).
REGLES:
- Usa vocabulari del nivell de l'estudiant (A2-B1)
- Frases curtes i clares
- Si l'estudiant comet errors, corregeix-los breument i continua
- Mantén el tema fins que l'estudiant vulgui acabar
- IMPORTANT: escriu TOT l'àrab amb vocalització completa (tashkil)
Format de cada missatge: primera línia en àrab, segona línia traducció al català entre parèntesis. Si cal: 💡 Correcció: ...`;

  try {
    const greeting = await callAI(systemPrompt, "Inicia la conversa temàtica");
    chatHistory = [{role:"assistant", text:greeting}];
    renderThemedChat(theme, systemPrompt);
  } catch(e) {
    if(e.message === "No API key" || e.message === "Invalid API key") return;
    document.getElementById("screen-ai-activity").innerHTML = `
    <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
      <div style="color:#f87171;font-size:18px;text-align:center;margin-bottom:16px">Error: ${e.message}</div>
      <button onclick="renderThemedMenu()" style="padding:14px 28px;border-radius:14px;border:none;background:#7c3aed;color:#fff;cursor:pointer">← Tornar</button>
    </div>`;
  }
}

function setThemedInput(text){
  const inp = document.getElementById('themed-input');
  if(inp) inp.value = text;
}

async function sendThemedChat(themeId, sysPrompt){
  const inp = document.getElementById('themed-input');
  if(!inp || !inp.value.trim()) return;
  const userText = inp.value.trim();
  inp.value = '';
  chatHistory.push({role:"user", text:userText});

  const theme = CONVERSATION_THEMES.find(t => t.id === themeId) || CONVERSATION_THEMES[0];
  const systemPrompt = window.themedSystemPrompt || sysPrompt;

  // Re-render with loading indicator
  const histForAI = chatHistory.map(m => ({role: m.role === "assistant" ? "assistant" : "user", content: m.text}));

  try {
    const reply = await callAI(systemPrompt, null, histForAI);
    chatHistory.push({role:"assistant", text:reply});
  } catch(e) {
    if(e.message === "No API key" || e.message === "Invalid API key") return;
    chatHistory.push({role:"assistant", text:"Error: " + e.message});
  }
  renderThemedChat(theme, systemPrompt);
}

function toggleArabicKb(){

  if(!kb) return;
  const isOpen = kb.style.display !== 'none';
  kb.style.display = isOpen ? 'none' : 'block';
  if(btn) btn.style.background = isOpen ? 'rgba(167,139,250,.1)' : 'rgba(167,139,250,.25)';
}
function insertChar(ch){
  const inp = document.getElementById('chat-input') || document.getElementById('themed-input');
  if(!inp) return;
  const s = inp.selectionStart, e = inp.selectionEnd;
  inp.value = inp.value.slice(0,s) + ch + inp.value.slice(e);
  inp.selectionStart = inp.selectionEnd = s + ch.length;
  inp.focus();
}
function deleteChar(){
  const inp = document.getElementById('chat-input') || document.getElementById('themed-input');
  if(!inp || inp.selectionStart === 0) return;
  const s = inp.selectionStart;
  inp.value = inp.value.slice(0,s-1) + inp.value.slice(s);
  inp.selectionStart = inp.selectionEnd = s-1;
  inp.focus();
}

function getSynPool(){
  if(synMode==='syn') return synAntData.synonyms.map(p=>({...p,type:'syn'}));
  if(synMode==='ant') return synAntData.antonyms.map(p=>({...p,type:'ant'}));
  return [
    ...synAntData.synonyms.map(p=>({...p,type:'syn'})),
    ...synAntData.antonyms.map(p=>({...p,type:'ant'}))
  ];
}

function startSynGame(){
  const pool = shuffle(getSynPool());
  const deck = pool.map(pair => {
    const showFirst = Math.random()>.5;
    const question = showFirst ? pair.ar1 : pair.ar2;
    const answer = showFirst ? pair.ar2 : pair.ar1;
    const answerCa = showFirst ? pair.ca2 : pair.ca1;
    // Generate 3 wrong options from same type, keeping translations
    const sameType = pair.type==='syn' ? synAntData.synonyms : synAntData.antonyms;
    const wrongPairs = shuffle(sameType.filter(p=>p.ar1!==pair.ar1)).slice(0,3);
    const wrongsWithCa = wrongPairs.map(p=>{
      const pick = Math.random()>.5;
      return {ar: pick?p.ar1:p.ar2, ca: pick?p.ca1:p.ca2};
    });
    const allOpts = shuffle([{ar:answer,ca:answerCa}, ...wrongsWithCa]);
    const options = allOpts.map(o=>o.ar);
    const optsCaMap = {};
    allOpts.forEach(o=>{ optsCaMap[o.ar]=o.ca; });
    return {question, answer, answerCa, type:pair.type, en:pair.en, options, optsCaMap, questionCa:showFirst?pair.ca1:pair.ca2};
  });
  synGameState = {deck, idx:0, score:0, total:deck.length, answered:false, selectedOpt:null};
  renderSynGame();
}

function renderSynGame(){
  const el=document.getElementById("screen-syn");
  const gs=synGameState;
  if(!gs||gs.idx>=gs.total){renderSynGameDone();return;}
  const card=gs.deck[gs.idx];
  const pct=(gs.idx/gs.total)*100;
  const typeLabel=card.type==='syn'?'مُرَادِف · Sinònim':'ضِدّ · Antònim';
  const typeColor=card.type==='syn'?'#06b6d4':'#f59e0b';

  const optsHtml=card.options.map(opt=>{

    if(gs.answered){
      if(opt===card.answer){bg='rgba(74,222,128,.15)';border='1px solid #4ade80';color='#4ade80';}
      else if(opt===gs.selectedOpt&&opt!==card.answer){bg='rgba(248,113,113,.15)';border='1px solid #f87171';color='#f87171';}
    }else if(opt===gs.selectedOpt){bg='rgba(16,185,129,.2)';border='1px solid #10b981';color='#10b981';}
    const caLabel = (gs.answered && card.optsCaMap && card.optsCaMap[opt]) ? `<div style="font-size:13px;color:#888;font-style:italic;margin-top:4px;direction:ltr;font-family:Georgia,serif">${card.optsCaMap[opt]}</div>` : '';
    return `<button onclick="${gs.answered?'':`selectSynOpt('${opt.replace(/'/g,"\\'")}')`}" style="padding:${gs.answered?'12px 16px':'16px'};border-radius:14px;border:${border};background:${bg};color:${color};font-size:26px;cursor:${gs.answered?'default':'pointer'};width:100%;text-align:center;direction:rtl;line-height:1.4"><span class="ar">${opt}</span>${caLabel}</button>`;
  }).join("");

  const feedbackHtml=gs.answered
    ?`<div style="margin-top:14px;padding:14px;border-radius:14px;background:${gs.selectedOpt===card.answer?'rgba(74,222,128,.1)':'rgba(248,113,113,.1)'};border:1px solid ${gs.selectedOpt===card.answer?'rgba(74,222,128,.3)':'rgba(248,113,113,.3)'}">
        <div style="color:${gs.selectedOpt===card.answer?'#4ade80':'#f87171'};font-size:16px;font-weight:700;margin-bottom:6px">${gs.selectedOpt===card.answer?'✓ Correcte!':'✗ Incorrecte'}</div>
        <div style="color:#aaa;font-size:14px">${card.en}</div>
      </div>
      <button onclick="nextSynCard()" style="margin-top:14px;width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(90deg,#10b981,#06b6d4);color:#0f0c29;font-weight:700;font-size:18px;cursor:pointer">${gs.idx+1>=gs.total?'Veure resultats':'Següent →'}</button>`
    :`<button onclick="checkSynAnswer()" style="margin-top:14px;width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(90deg,#10b981,#06b6d4);color:#0f0c29;font-weight:700;font-size:18px;cursor:pointer;opacity:${gs.selectedOpt?1:0.4}">Comprovar</button>`;

  el.innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div style="max-width:520px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <button onclick="renderSynMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>
        <div class="grad-bar" style="flex:1"><div style="height:100%;background:linear-gradient(90deg,#10b981,#06b6d4);border-radius:4px;transition:width .3s;width:${pct}%"></div></div>
        <span style="color:#888;font-size:17px">${gs.idx+1}/${gs.total}</span>
      </div>
      <div style="text-align:center;margin-bottom:12px">
        <span style="font-size:12px;letter-spacing:1px;border:1px solid ${typeColor};color:${typeColor};border-radius:20px;padding:4px 14px">${typeLabel}</span>
      </div>
      <div class="card" style="border-color:rgba(16,185,129,.2)">
        <div style="text-align:center;margin-bottom:16px">
          <div class="ar" style="font-size:46px;color:#fff;line-height:1.4;margin-bottom:6px">${card.question}</div>
          <div style="font-size:14px;color:#666;font-style:italic">${card.questionCa}</div>

        <div style="font-size:15px;color:#aaa;text-align:center;margin-bottom:16px">${questionText}</div>

      <div style="text-align:center;margin-top:12px;color:#555;font-size:14px">Puntuació: ${gs.score}/${gs.idx}</div>
    </div>
  </div>`;
}

function selectSynOpt(opt){
  if(!synGameState||synGameState.answered)return;
  synGameState.selectedOpt=opt;
  renderSynGame();
}
function checkSynAnswer(){
  if(!synGameState||!synGameState.selectedOpt)return;
  synGameState.answered=true;
  if(synGameState.selectedOpt===synGameState.deck[synGameState.idx].answer)synGameState.score++;
  renderSynGame();
}
function nextSynCard(){
  synGameState.idx++;
  synGameState.answered=false;
  synGameState.selectedOpt=null;
  renderSynGame();
}
function renderSynGameDone(){
  const gs=synGameState;
  const pct=Math.round((gs.score/gs.total)*100);
  const emoji=pct>=80?'🏆':pct>=60?'👍':pct>=40?'💪':'📚';

// ── SYNONYM/ANTONYM LIST ─────────────────────────────────────────────────
function renderSynList(){
  const el=document.getElementById("screen-syn");
  const pool=getSynPool();
  const filtered=pool.filter(p=>{
    if(!synSearch)return true;
    const s=synSearch.toLowerCase();
    return p.ar1.includes(synSearch)||p.ar2.includes(synSearch)||p.ca1.toLowerCase().includes(s)||p.ca2.toLowerCase().includes(s)||p.en.toLowerCase().includes(s);
  });

  const syns=filtered.filter(p=>p.type==='syn');
  const ants=filtered.filter(p=>p.type==='ant');

  function pairCard(p){
    const color=p.type==='syn'?'#06b6d4':'#f59e0b';
    const borderColor=p.type==='syn'?'rgba(6,182,212,.2)':'rgba(245,158,11,.2)';
    const symbol=p.type==='syn'?'=':'≠';
    return `<div style="background:rgba(255,255,255,.04);border:1px solid ${borderColor};border-radius:16px;padding:14px 16px">
      <div style="display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap">
        <div style="text-align:center;flex:1;min-width:100px">
          <div class="ar" style="font-size:28px;color:#fff;line-height:1.4">${p.ar1}</div>
          <div style="font-size:13px;color:#888;margin-top:2px">${p.ca1}</div>
          <button onclick="speakAr('${p.ar1.replace(/'/g,"\\'")}')" style="background:none;border:none;color:${color};font-size:14px;cursor:pointer;margin-top:2px">🔈</button>
        </div>
        <div style="font-size:28px;color:${color};font-weight:700">${symbol}</div>
        <div style="text-align:center;flex:1;min-width:100px">
          <div class="ar" style="font-size:28px;color:#fff;line-height:1.4">${p.ar2}</div>
          <div style="font-size:13px;color:#888;margin-top:2px">${p.ca2}</div>
          <button onclick="speakAr('${p.ar2.replace(/'/g,"\\'")}')" style="background:none;border:none;color:${color};font-size:14px;cursor:pointer;margin-top:2px">🔈</button>
        </div>
      </div>
    </div>`;
  }

  let content='';
  if(synMode!=='ant'&&syns.length>0){
    content+=`<div style="font-size:12px;letter-spacing:2px;color:#06b6d4;text-transform:uppercase;margin:16px 0 10px">مُرَادِف · Sinònims (${syns.length})</div>`;
    content+=syns.map(pairCard).join("");
  }
  if(synMode!=='syn'&&ants.length>0){
    content+=`<div style="font-size:12px;letter-spacing:2px;color:#f59e0b;text-transform:uppercase;margin:16px 0 10px">ضِدّ · Antònims (${ants.length})</div>`;
    content+=ants.map(pairCard).join("");
  }

  el.innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div style="max-width:640px;margin:0 auto">

        <button onclick="renderSynMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>
        <h2 style="font-size:22px;background:linear-gradient(90deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Llista d'estudi</h2>

      <div style="display:flex;flex-direction:column;gap:10px">${content}</div>

async function startRoleplay(missionId){
  const mission = ROLEPLAY_MISSIONS.find(m=>m.id===missionId);
  if(!mission)return;
  chatHistory=[];
  roleplayState={mission,completed:false};
  showAILoading("roleplay");

  const sysPrompt = `Ets un parlant natiu d'àrab en un roleplay. ${VOCAB_CONTEXT}
MISSIÓ DE L'ESTUDIANT: ${mission.objective}
SITUACIÓ: ${mission.label}
ROL: Actua el paper adequat (venedor, metge, recepcionista...). Inicia la conversa de forma natural.
REGLES:
- Frases curtes i clares, nivell A2-B1
- Si comet errors, corregeix-los breument amb 💡
- Quan l'estudiant hagi completat l'objectiu, acaba el missatge amb: ✅ MISSIÓ COMPLETADA!
- Si no ho aconsegueix després de 8 missatges, dona pistes
- ÀRAB amb tashkil complet SEMPRE
Format: línia àrab + traducció català`;

  try{
    const greeting=await callAI(sysPrompt,"Inicia el roleplay");
    chatHistory=[{role:"assistant",text:greeting}];
    window.roleplaySystemPrompt=sysPrompt;
    renderRoleplayChat(mission);
  }catch(e){
    if(e.message==="No API key")return;
    document.getElementById("screen-ai-activity").innerHTML=`
    <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">

      <button onclick="renderRoleplayMenu()" style="padding:14px 28px;border-radius:14px;border:none;background:#7c3aed;color:#fff;cursor:pointer">← Tornar</button>
    </div>`;
  }
}

async function sendRoleplayChat(){
  const inp=document.getElementById('themed-input');
  if(!inp||!inp.value.trim())return;
  const userText=inp.value.trim();
  inp.value='';
  chatHistory.push({role:"user",text:userText});
  const mission=roleplayState.mission;
  const histForAI=chatHistory.map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.text}));
  try{
    const reply=await callAI(window.roleplaySystemPrompt,null,histForAI);
    chatHistory.push({role:"assistant",text:reply});
    if(reply.includes('MISSIÓ COMPLETADA'))logSession('roleplay');
  }catch(e){
    chatHistory.push({role:"assistant",text:"Error: "+e.message});
  }
  renderRoleplayChat(mission);
}

  if(!bs||bs.idx>=bs.deck.length){renderBuildDone();return;}
  const card=bs.deck[bs.idx];
  const pct=(bs.idx/bs.deck.length)*100;
  const available=shuffle([...card.words]).filter(w=>!bs.selected.includes(bs.selected.indexOf(w)>=0?'__used__':''));

  // Track which words are used by index
  const wordPool=[...card.words];
  const shuffledPool=shuffle(wordPool.map((w,i)=>({w,i})));
  const usedIndices=bs.selected.map(s=>s.idx);
  const remaining=shuffledPool.filter(s=>!usedIndices.includes(s.idx));

  const selectedHtml=bs.selected.map((s,i)=>`
    <button onclick="${bs.answered?'':`removeBuildWord(${i})`}" style="padding:8px 14px;border-radius:10px;border:1px solid rgba(245,158,11,.5);background:rgba(245,158,11,.15);color:#fbbf24;font-family:Arial,sans-serif;font-size:22px;cursor:${bs.answered?'default':'pointer'};direction:rtl">${s.word}</button>`).join("");

  const poolHtml=remaining.map(s=>`
    <button onclick="addBuildWord(${s.i},'${s.w.replace(/'/g,"\\'")}')" style="padding:10px 16px;border-radius:12px;border:1px solid #444;background:rgba(255,255,255,.06);color:#ccc;font-family:Arial,sans-serif;font-size:22px;cursor:pointer;direction:rtl">${s.w}</button>`).join("");

  let feedbackHtml='';
  if(bs.answered){
    const userSentence=bs.selected.map(s=>s.word).join(' ');
    const isCorrect=userSentence===card.correct;
    feedbackHtml=`<div style="margin-top:14px;padding:14px;border-radius:14px;background:${isCorrect?'rgba(74,222,128,.1)':'rgba(248,113,113,.1)'};border:1px solid ${isCorrect?'rgba(74,222,128,.3)':'rgba(248,113,113,.3)'}">
      <div style="color:${isCorrect?'#4ade80':'#f87171'};font-size:16px;font-weight:700;margin-bottom:6px">${isCorrect?'✓ Correcte!':'✗ Incorrecte'}</div>
      ${!isCorrect?`<div class="ar" style="font-size:22px;color:#4ade80;direction:rtl;margin-bottom:4px">${card.correct}</div>`:''}

    <button onclick="nextBuildCard()" style="margin-top:14px;width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(90deg,#f59e0b,#ec4899);color:#fff;font-weight:700;font-size:18px;cursor:pointer">${bs.idx+1>=bs.deck.length?'Veure resultats':'Següent →'}</button>`;
  }

  el.innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div style="max-width:520px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <button onclick="showScreen('menu');renderMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>

      </div>
      <div class="card" style="border-color:rgba(245,158,11,.2)">
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:12px;letter-spacing:2px;color:#f59e0b;text-transform:uppercase;margin-bottom:8px">🧩 Ordena les paraules</div>
          <div style="font-size:15px;color:#888;font-style:italic;margin-bottom:14px">${card.ca}</div>
        </div>
        <div style="min-height:50px;background:rgba(245,158,11,.06);border:2px dashed rgba(245,158,11,.3);border-radius:14px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:rtl;margin-bottom:16px">
          ${selectedHtml||'<span style="color:#555;font-size:14px">Clica les paraules per construir la frase</span>'}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:rtl">${poolHtml}</div>
        ${!bs.answered&&bs.selected.length===card.words.length?`<button onclick="checkBuildAnswer()" style="margin-top:14px;width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(90deg,#f59e0b,#ec4899);color:#fff;font-weight:700;font-size:18px;cursor:pointer">Comprovar</button>`:''}
        ${feedbackHtml}
      </div>
      <div style="text-align:center;margin-top:12px;color:#555;font-size:14px">Puntuació: ${bs.score}/${bs.idx}</div>
    </div>
  </div>`;
}

function addBuildWord(idx,word){
  if(buildState.answered)return;
  buildState.selected.push({idx,word});
  renderBuildCard();
}
function removeBuildWord(i){
  if(buildState.answered)return;
  buildState.selected.splice(i,1);
  renderBuildCard();
}
function checkBuildAnswer(){
  const bs=buildState;
  const card=bs.deck[bs.idx];
  const userSentence=bs.selected.map(s=>s.word).join(' ');
  bs.answered=true;
  if(userSentence===card.correct)bs.score++;
  renderBuildCard();
}
function nextBuildCard(){
  buildState.idx++;
  buildState.selected=[];
  buildState.answered=false;
  renderBuildCard();
}
function renderBuildDone(){
  logSession('build');
  const bs=buildState;
  const pct=Math.round((bs.score/bs.deck.length)*100);
  const emoji=pct>=80?'🏆':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById("screen-build").innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
    <div style="font-size:72px">${emoji}</div>
    <h2 style="font-size:32px;margin:16px 0 8px;background:linear-gradient(90deg,#f59e0b,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${bs.score} / ${bs.deck.length}</h2>
    <p style="color:#aaa;font-size:18px">${pct}% correctes</p>
    <div style="display:flex;gap:12px;margin-top:28px">
      <button onclick="renderBuildMenu()" style="padding:16px 28px;border-radius:16px;border:none;background:linear-gradient(90deg,#f59e0b,#ec4899);color:#fff;font-weight:700;font-size:16px;cursor:pointer">🔄 Repetir</button>
      <button onclick="showScreen('menu');renderMenu()" style="padding:16px 28px;border-radius:16px;border:2px solid #444;background:transparent;color:#888;font-size:16px;cursor:pointer">← Menú</button>

}

function insertDictChar(ch){
  const inp=document.getElementById('dict-input');
  if(!inp)return;
  const s=inp.selectionStart,e=inp.selectionEnd;
  inp.value=inp.value.slice(0,s)+ch+inp.value.slice(e);
  inp.selectionStart=inp.selectionEnd=s+ch.length;
  inp.focus();
  dictState.userInput=inp.value;
}
function deleteDictChar(){
  const inp=document.getElementById('dict-input');
  if(!inp||inp.selectionStart===0)return;
  const s=inp.selectionStart;
  inp.value=inp.value.slice(0,s-1)+inp.value.slice(s);
  inp.selectionStart=inp.selectionEnd=s-1;
  inp.focus();
  dictState.userInput=inp.value;
}
function checkDictAnswer(){
  const ds=dictState;
  const card=ds.deck[ds.idx];
  ds.checked=true;
  const strip=s=>s.replace(/[ً-ٰٟ]/g,'').replace(/\s+/g,' ').trim();
  if(strip(ds.userInput)===strip(card.ar)||strip(ds.userInput)===strip(card.plain))ds.score++;
  renderDictation();
}
function nextDictCard(){
  dictState.idx++;
  dictState.userInput='';
  dictState.checked=false;
  dictState.showHint=false;
  renderDictation();
}

function insertSceneChar(ch){
  const inp=document.getElementById('scene-input');
  if(!inp)return;
  const s=inp.selectionStart,e=inp.selectionEnd;
  inp.value=inp.value.slice(0,s)+ch+inp.value.slice(e);
  inp.selectionStart=inp.selectionEnd=s+ch.length;
  inp.focus();
  sceneState.userInput=inp.value;
}
function deleteSceneChar(){
  const inp=document.getElementById('scene-input');
  if(!inp||inp.selectionStart===0)return;
  const s=inp.selectionStart;
  inp.value=inp.value.slice(0,s-1)+inp.value.slice(s);
  inp.selectionStart=inp.selectionEnd=s-1;
  inp.focus();
  sceneState.userInput=inp.value;
}

async function evaluateScene(){
  if(!sceneState.userInput.trim())return;
  logSession('scene');
  const ss=sceneState;
  try{
    const feedback=await callAI(
      `Ets un professor d'àrab MSA. Avalua la descripció d'una escena feta per un estudiant A2-B1. ${VOCAB_SHORT}
Respon en català amb:
📊 PUNTUACIÓ: X/10
✓ Coses ben fetes
❌ Errors gramaticals (el que ha escrit → el correcte)
💡 Com millorar-ho
Escriu qualsevol àrab amb tashkil complet.`,
      `ESCENA: ${ss.scene}\n\nDESCRIPCIÓ DE L'ESTUDIANT:\n${ss.userInput}\n\nRESPOSTA MODEL:\n${ss.sample}`
    );
    ss.evaluated=true;
    ss.feedback=feedback;
    renderScene();
  }catch(e){
    alert("Error: "+e.message);
  }
}

// Extend the existing buildNormalDeck to weight verbs by vocabStats too
const _originalBuildNormalDeck = buildNormalDeck;
// Override is unnecessary: the existing mechanism with verb stats already works.
// We add vocab stats tracking for synonym game answers.

function trackSynAnswer(word, correct){
  const vs=loadVocabStats();
  const e=vs[word]||{correct:0,wrong:0,lastSeen:0};
  if(correct) e.correct++;
  else e.wrong++;
  e.lastSeen=Date.now();
  vs[word]=e;
  saveVocabStats(vs);
}

// Patch checkSynAnswer to track vocab stats
const _origCheckSynAnswer = checkSynAnswer;
checkSynAnswer = function(){
  if(!synGameState||!synGameState.selectedOpt)return;
  const card=synGameState.deck[synGameState.idx];
  const correct=synGameState.selectedOpt===card.answer;
  trackSynAnswer(card.question, correct);
  trackSynAnswer(card.answer, correct);
  synGameState.answered=true;
  if(correct)synGameState.score++;
  renderSynGame();
};

// Override startSynGame to sort pool by error rate (spaced repetition)
const _origStartSynGame = startSynGame;
startSynGame = function(){
  const pool = getSynPool();
  const vs=loadVocabStats();
  // Weight: words with more errors appear more often
  const weighted=[];
  pool.forEach(pair=>{
    const e1=vs[pair.ar1]||{wrong:0};
    const e2=vs[pair.ar2]||{wrong:0};
    const errorWeight=1+Math.min(e1.wrong+e2.wrong,4);
    for(let i=0;i<errorWeight;i++) weighted.push(pair);
  });
  const shuffled=shuffle(weighted);
  // Remove duplicates (keep first occurrence)
  const seen=new Set();
  const unique=[];
  shuffled.forEach(p=>{
    const key=p.ar1+'|'+p.ar2;
    if(!seen.has(key)){seen.add(key);unique.push(p);}
  });

  const deck=unique.map(pair=>{
    const showFirst=Math.random()>.5;
    const question=showFirst?pair.ar1:pair.ar2;
    const answer=showFirst?pair.ar2:pair.ar1;
    const answerCa=showFirst?pair.ca2:pair.ca1;
    const sameType=pair.type==='syn'?synAntData.synonyms:synAntData.antonyms;
    const wrongPairs=shuffle(sameType.filter(p=>p.ar1!==pair.ar1)).slice(0,3);
    const wrongsWithCa=wrongPairs.map(p=>{
      const pick=Math.random()>.5;
      return{ar:pick?p.ar1:p.ar2,ca:pick?p.ca1:p.ca2};
    });
    const allOpts=shuffle([{ar:answer,ca:answerCa},...wrongsWithCa]);
    const options=allOpts.map(o=>o.ar);
    const optsCaMap={};
    allOpts.forEach(o=>{optsCaMap[o.ar]=o.ca;});
    return{question,answer,answerCa,type:pair.type,en:pair.en,options,optsCaMap,questionCa:showFirst?pair.ca1:pair.ca2};
  });
  synGameState={deck,idx:0,score:0,total:deck.length,answered:false,selectedOpt:null};
  renderSynGame();
};

function getAllVocabWords(){
  let all = [];
  Object.entries(VOCAB_FLASH_CATEGORIES).forEach(([cat,words])=>{
    words.forEach(w => all.push({...w, cat}));
  });
  return all;
}

let vocabFlashDir = "ar→ca";

function toggleVocabCat(cat){
  const idx = vocabFlashSelectedCats.indexOf(cat);
  if(idx===-1) vocabFlashSelectedCats.push(cat);
  else vocabFlashSelectedCats.splice(idx,1);
  // adjust count if needed
  const avail = vocabFlashSelectedCats.length === 0
    ? getAllVocabWords().length
    : vocabFlashSelectedCats.reduce((s,c) => s + VOCAB_FLASH_CATEGORIES[c].length, 0);
  if(vocabFlashCount > avail) vocabFlashCount = Math.max(10, Math.floor(avail/10)*10 || 10);
  renderVocabFlashMenu();
}

function setVocabCount(n){ vocabFlashCount = n; renderVocabFlashMenu(); }

function startVocabFlash(){
  let pool = [];
  if(vocabFlashSelectedCats.length === 0){
    pool = getAllVocabWords();
  } else {
    vocabFlashSelectedCats.forEach(cat => {
      VOCAB_FLASH_CATEGORIES[cat].forEach(w => pool.push({...w, cat}));
    });
  }
  pool = shuffle(pool).slice(0, Math.min(vocabFlashCount, pool.length));

  // Build deck with 4 options each
  const allWords = getAllVocabWords();
  const deck = pool.map(word => {
    const dir = vocabFlashDir === "mix" ? (Math.random()>.5 ? "ar→ca" : "ca→ar") : vocabFlashDir;
    // pick 3 wrong answers
    const wrongs = shuffle(allWords.filter(w => w.ar !== word.ar))
      .slice(0,3)
      .map(w => dir==="ar→ca" ? w.tr : w.ar);
    const correct = dir==="ar→ca" ? word.tr : word.ar;
    const options = shuffle([correct, ...wrongs]);
    return { word, dir, options, correct };
  });

  vocabFlashState = { deck, idx:0, score:0, total:deck.length, answered:false, selectedOpt:null };
  renderVocabFlashCard();
}

function renderVocabFlashCard(){
  const s = vocabFlashState;
  if(!s) return;
  if(s.idx >= s.total){ renderVocabFlashResult(); return; }

  const card = s.deck[s.idx];
  const prompt = card.dir==="ar→ca" ? card.word.ar : card.word.tr;
  const promptLabel = card.dir==="ar→ca" ? "Què significa?" : "Com es diu en àrab?";
  const isAr = card.dir==="ar→ca";
  const progress = Math.round((s.idx/s.total)*100);

  const optBtns = card.options.map((opt,i) => {
    let style = "padding:14px;border-radius:14px;border:2px solid #444;background:rgba(255,255,255,.04);color:#ccc;font-size:16px;cursor:pointer;width:100%;text-align:center;";
    if(s.answered){
      if(opt === card.correct) style = "padding:14px;border-radius:14px;border:2px solid #4ade80;background:rgba(74,222,128,.15);color:#4ade80;font-size:16px;cursor:default;width:100%;text-align:center;font-weight:700;";
      else if(opt === s.selectedOpt) style = "padding:14px;border-radius:14px;border:2px solid #f87171;background:rgba(248,113,113,.15);color:#f87171;font-size:16px;cursor:default;width:100%;text-align:center;";
      else style = "padding:14px;border-radius:14px;border:2px solid #333;background:rgba(255,255,255,.02);color:#555;font-size:16px;cursor:default;width:100%;text-align:center;";
    }
    const optIsAr = card.dir==="ca→ar";
    const cls = optIsAr ? 'class="ar"' : '';
    return `<button ${cls} onclick="${s.answered?'':`answerVocabFlash(${i})`}" style="${style}">${opt}</button>`;
  }).join("");

  document.getElementById("screen-vocabflash").innerHTML = `
  <div class="wrap" style="padding-top:30px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <button onclick="showScreen('menu');renderMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>
      <span style="color:#888;font-size:14px">${s.idx+1} / ${s.total}</span>
      <span style="color:#f9d423;font-size:14px;font-weight:700">${s.score} ✓</span>
    </div>
    <div class="grad-bar" style="margin-bottom:24px"><div class="grad-bar-fill" style="width:${progress}%"></div></div>

    <div class="card" style="text-align:center;margin-bottom:24px">
      <div style="font-size:12px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">${promptLabel}</div>
      <div ${isAr?'class="ar"':''} style="font-size:${isAr?'44px':'24px'};color:#fff;line-height:1.4;margin-bottom:8px">${prompt}</div>
      ${isAr ? `<button onclick='speakAr(${JSON.stringify(prompt)})' style="background:none;border:none;font-size:22px;cursor:pointer;padding:4px 14px">🔈</button>` : ""}
      ${card.word.cat ? `<div style="font-size:11px;color:#666;margin-top:4px">${card.word.cat}</div>` : ""}
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      ${optBtns}
    </div>

    ${s.answered ? `
    <div style="text-align:center;margin-top:20px">
      <div style="color:#888;font-size:13px;margin-bottom:6px">${isAr ? card.word.tr : card.word.ar} ${isAr ? '' : '· '+card.word.tr}</div>
      <button onclick="nextVocabFlash()" class="btn-main" style="margin-top:12px;font-size:16px;padding:14px">Següent →</button>
    </div>` : ""}
  </div>`;
}

function answerVocabFlash(optIdx){
  const s = vocabFlashState;
  if(!s || s.answered) return;
  const card = s.deck[s.idx];
  const chosen = card.options[optIdx];
  s.selectedOpt = chosen;
  s.answered = true;
  const isCorrect = chosen === card.correct;
  if(isCorrect) s.score++;
  else card.wasWrong = true;
  // Track per-word stats
  const key = card.word.ar;
  if(!vflashStats[key]) vflashStats[key] = {ok:0,fail:0,last:""};
  if(isCorrect) vflashStats[key].ok++;
  else vflashStats[key].fail++;
  vflashStats[key].last = new Date().toISOString().slice(0,10);
  saveVFlashStats(vflashStats);
  renderVocabFlashCard();
}

function nextVocabFlash(){
  const s = vocabFlashState;
  if(!s) return;
  s.idx++;
  s.answered = false;
  s.selectedOpt = null;
  renderVocabFlashCard();
}

function renderVocabFlashResult(){
  const s = vocabFlashState;
  const pct = Math.round((s.score/s.total)*100);
  const emoji = pct>=90?"🌟":pct>=70?"👏":pct>=50?"💪":"📖";
  const msg = pct>=90?"Excel·lent!":pct>=70?"Molt bé!":pct>=50?"Bé, continua practicant!":"Necessites repassar més!";

  // collect wrong answers from this session
  const wrongs = s.deck.filter(c => c.wasWrong);

  const wrongsHtml = wrongs.length > 0 ? `
    <div style="margin-top:20px;text-align:left;width:100%">
      <div style="font-size:12px;color:#f87171;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Paraules fallades en aquesta ronda:</div>
      ${wrongs.map(c => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.06)">
          <button onclick='speakAr(${JSON.stringify(c.word.ar)})' style="background:none;border:none;font-size:16px;cursor:pointer">🔈</button>
          <div class="ar" style="font-size:20px;color:#fca5a5;flex:1">${c.word.ar}</div>
          <div style="font-size:13px;color:#888">${c.word.tr}</div>
        </div>`).join("")}
    </div>` : "";

  document.getElementById("screen-vocabflash").innerHTML = `
  <div class="wrap center" style="min-height:100vh">
    <div class="card" style="text-align:center;width:100%;max-width:440px">
      <div style="font-size:72px;margin-bottom:12px">${emoji}</div>
      <h2 style="font-size:28px;color:#fff;margin-bottom:8px">${msg}</h2>
      <div style="font-size:48px;font-weight:700;background:linear-gradient(90deg,#f9d423,#ff4e50);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px">${s.score} / ${s.total}</div>
      <div style="font-size:16px;color:#888;margin-bottom:24px">${pct}% correcte</div>
      ${wrongsHtml}
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px">
        <button onclick="startVocabFlash()" style="padding:14px 24px;border-radius:16px;border:none;background:linear-gradient(90deg,#f9d423,#ff4e50);color:#1a1a2e;font-weight:700;font-size:16px;cursor:pointer">🔄 Repetir</button>
        <button onclick="showScreen('vocabflash');renderVocabFlashMenu()" style="padding:14px 24px;border-radius:16px;border:2px solid #444;background:transparent;color:#888;font-size:16px;cursor:pointer">⚙️ Canviar opcions</button>
        <button onclick="showScreen('vocablist');renderVocabList()" style="padding:14px 24px;border-radius:16px;border:2px solid #8b5cf6;background:rgba(139,92,246,.08);color:#a78bfa;font-size:16px;cursor:pointer">📖 Veure errors</button>
        <button onclick="showScreen('menu');renderMenu()" style="padding:14px 24px;border-radius:16px;border:2px solid #444;background:transparent;color:#888;font-size:16px;cursor:pointer">← Menú</button>
      </div>
    </div>
  </div>`;

  // Log activity
  try{
    const log = JSON.parse(localStorage.getItem("arabic_activity_log_v1")||"[]");
    log.push({type:"vocab_flash",date:new Date().toISOString(),score:s.score,total:s.total});
    localStorage.setItem("arabic_activity_log_v1",JSON.stringify(log.slice(-200)));
  }catch(e){}
}

// ══════════════════════════════════════════════════════════════════════════
// VOCABULARY LIST (full browser with stats)
// ══════════════════════════════════════════════════════════════════════════

let vocabListFilter = "all"; // "all" or category key
let vocabListSort = "cat";   // "cat" | "fails" | "alpha"

function renderVocabList(){
  const cats = Object.keys(VOCAB_FLASH_CATEGORIES);
  const allWords = getAllVocabWords();

  // filter
  let words = vocabListFilter === "all"
    ? allWords
    : allWords.filter(w => w.cat === vocabListFilter);

  // sort
  if(vocabListSort === "fails"){
    words.sort((a,b) => {
      const fa = (vflashStats[a.ar]||{}).fail||0;
      const fb = (vflashStats[b.ar]||{}).fail||0;
      return fb - fa || a.ar.localeCompare(b.ar,"ar");
    });
  } else if(vocabListSort === "alpha"){
    words.sort((a,b) => a.ar.localeCompare(b.ar,"ar"));
  }
  // "cat" = default order by category

  // top failures summary
  const allWithStats = allWords.map(w => ({...w, ...(vflashStats[w.ar]||{ok:0,fail:0})})).filter(w=>w.fail>0);
  allWithStats.sort((a,b) => b.fail - a.fail);
  const topFails = allWithStats.slice(0,8);

  const totalOk = Object.values(vflashStats).reduce((s,v)=>s+(v.ok||0),0);
  const totalFail = Object.values(vflashStats).reduce((s,v)=>s+(v.fail||0),0);
  const totalPlayed = totalOk + totalFail;

  // filter buttons
  const filterBtns = [`<button onclick="vocabListFilter='all';renderVocabList()" style="padding:6px 12px;border-radius:10px;border:1px solid ${vocabListFilter==='all'?'#f9d423':'#444'};background:${vocabListFilter==='all'?'rgba(249,212,35,.12)':'rgba(255,255,255,.04)'};color:${vocabListFilter==='all'?'#f9d423':'#888'};font-size:12px;cursor:pointer">Totes</button>`]
    .concat(cats.map(cat =>
      `<button onclick="vocabListFilter='${cat}';renderVocabList()" style="padding:6px 10px;border-radius:10px;border:1px solid ${vocabListFilter===cat?'#f9d423':'#444'};background:${vocabListFilter===cat?'rgba(249,212,35,.12)':'rgba(255,255,255,.04)'};color:${vocabListFilter===cat?'#f9d423':'#888'};font-size:12px;cursor:pointer">${cat}</button>`
    )).join("");

  // word rows
  let currentCat = "";
  let rows = "";
  words.forEach(w => {
    const st = vflashStats[w.ar] || {ok:0,fail:0};
    const total = st.ok + st.fail;
    const pct = total > 0 ? Math.round((st.ok/total)*100) : -1;

    // category header (only in "cat" sort)
    if(vocabListSort === "cat" && vocabListFilter === "all" && w.cat !== currentCat){
      currentCat = w.cat;
      rows += `<div style="padding:12px 0 6px;border-bottom:1px solid #333;margin-top:12px">
        <span style="font-size:15px;font-weight:700;color:#f9d423">${w.cat}</span>
        <span style="color:#666;font-size:12px;margin-left:8px">${VOCAB_FLASH_CATEGORIES[w.cat].length} paraules</span>
      </div>`;
    }

    // color by performance
    let barColor = "#444";
    let failBadge = "";
    if(total > 0){
      barColor = pct >= 80 ? "#4ade80" : pct >= 50 ? "#fbbf24" : "#f87171";
    }
    if(st.fail > 0){
      failBadge = `<span style="color:#f87171;font-size:11px;font-weight:700">${st.fail}✗</span>`;
    }

    rows += `<div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.06)">
      <button onclick='speakAr(${JSON.stringify(w.ar)})' style="background:none;border:none;font-size:16px;cursor:pointer;padding:2px 6px;flex-shrink:0">🔈</button>
      <div style="flex:1;min-width:0">
        <div class="ar" style="font-size:22px;color:#fff;line-height:1.3">${w.ar}</div>
        <div style="font-size:13px;color:#888;margin-top:2px">${w.tr}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;min-width:70px">
        ${total > 0 ? `
          <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
            <span style="color:#4ade80;font-size:11px">${st.ok}✓</span>
            ${failBadge}
          </div>
          <div style="width:50px;height:4px;background:#333;border-radius:2px;margin-top:4px;margin-left:auto">
            <div style="width:${pct}%;height:100%;background:${barColor};border-radius:2px"></div>
          </div>
        ` : `<span style="color:#555;font-size:11px">—</span>`}
      </div>
    </div>`;
  });

  document.getElementById("screen-vocablist").innerHTML = `
  <div class="wrap" style="padding-top:30px;padding-bottom:40px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <button onclick="showScreen('menu');renderMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>
      <h2 style="font-size:22px;color:#fff">📖 Tot el Vocabulari</h2>
    </div>

    ${totalPlayed > 0 ? `
    <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;margin-bottom:20px">
      <div style="display:flex;justify-content:space-around;text-align:center;margin-bottom:${topFails.length>0?'14px':'0'}">
        <div><div style="font-size:24px;font-weight:700;color:#fff">${totalPlayed}</div><div style="font-size:11px;color:#888">respostes</div></div>
        <div><div style="font-size:24px;font-weight:700;color:#4ade80">${totalOk}</div><div style="font-size:11px;color:#888">correctes</div></div>
        <div><div style="font-size:24px;font-weight:700;color:#f87171">${totalFail}</div><div style="font-size:11px;color:#888">errors</div></div>
        <div><div style="font-size:24px;font-weight:700;color:#fbbf24">${totalPlayed>0?Math.round((totalOk/totalPlayed)*100):0}%</div><div style="font-size:11px;color:#888">taxa</div></div>
      </div>
      ${topFails.length > 0 ? `
      <div style="border-top:1px solid rgba(255,255,255,.08);padding-top:12px">
        <div style="font-size:12px;color:#f87171;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">🔥 Més fallades</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${topFails.map(w => `<span class="ar" style="padding:4px 10px;border-radius:8px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#fca5a5;font-size:14px">${w.ar} <span style="font-size:10px;color:#f87171">(${w.fail}✗)</span></span>`).join("")}
        </div>
      </div>` : ""}
    </div>` : ""}

    <div style="margin-bottom:16px">
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
        ${filterBtns}
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="vocabListSort='cat';renderVocabList()" class="seg-btn ${vocabListSort==='cat'?'active-y':''}" style="flex:1;padding:8px;font-size:12px">Per categoria</button>
        <button onclick="vocabListSort='fails';renderVocabList()" class="seg-btn ${vocabListSort==='fails'?'active-y':''}" style="flex:1;padding:8px;font-size:12px">Per errors ↓</button>
        <button onclick="vocabListSort='alpha';renderVocabList()" class="seg-btn ${vocabListSort==='alpha'?'active-y':''}" style="flex:1;padding:8px;font-size:12px">Alfabètic</button>
      </div>
    </div>

    <div style="color:#666;font-size:12px;margin-bottom:8px">${words.length} paraules</div>
    <div>${rows}</div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════════════
// Preload voices
if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener("voiceschanged",()=>window.speechSynthesis.getVoices());
}
renderMenu();
</script>
