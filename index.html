// ── STORAGE ───────────────────────────────────────────────────────────────
const STORAGE_KEY = "arabic_verb_stats_v3";
function loadStats(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch(e){}return{};}
function saveStats(s){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch(e){}}
let stats = loadStats();

// ── STATE ─────────────────────────────────────────────────────────────────
let tenseMode = "both";    // both|present|past
let direction = "mix";     // ar→en|en→ar|mix
let cardCount = 20;
let deck = [];
let deckIdx = 0;
let isDrill = false;
let flipped = false;
let speaking = null;
let currentScreen = "menu";

// ── HELPERS ───────────────────────────────────────────────────────────────
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}
function failedVerbs(){return verbs.filter(v=>(stats[v.en]||{}).fails>0);}
function makeDir(){return direction==="mix"?(Math.random()>.5?"ar→en":"en→ar"):direction;}

function speakAr(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ar-SA";u.rate=0.85;
  const v=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith("ar"));
  if(v)u.voice=v;
  window.speechSynthesis.speak(u);
}

function buildNormalDeck(){
  const pool=shuffle(verbs).slice(0,cardCount);
  const w=[];
  pool.forEach(v=>{
    const f=(stats[v.en]||{}).fails||0;
    w.push(v);
    if(f>=2)w.push(v);
    if(f>=5)w.push(v);
  });
  return shuffle(w).map(v=>({verb:v,dir:makeDir()}));
}
function buildDrillDeck(){
  return shuffle(failedVerbs()).map(v=>({verb:v,dir:makeDir()}));
}

// ── NAVIGATE ──────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+id).classList.add("active");
  currentScreen=id;
  window.scrollTo(0,0);
}

// ── ARABIC BLOCK ──────────────────────────────────────────────────────────
function arabicBlock(verb, color){
  const showP = tenseMode!=="past", showPa = tenseMode!=="present";
  const c = color||"#fff";
  let html = '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">';
  if(showP){
    html+=`<div class="ar-box-present">
      <div class="badge-present">مضارع · Present</div>
      <div class="ar" style="font-size:42px;color:${c};line-height:1.4;margin-top:8px">${verb.present}</div>
      <button class="speak-btn" style="color:#f9d423" onclick="speakAr(${JSON.stringify(verb.present)});this.textContent='🔊';setTimeout(()=>this.textContent='🔈',1800)">🔈</button>
    </div>`;
  }
  if(showPa){
    html+=`<div class="ar-box-past">
      <div class="badge-past">ماضي · Past</div>
      <div class="ar" style="font-size:42px;color:${c};line-height:1.4;margin-top:8px">${verb.past}</div>
      <button class="speak-btn" style="color:#ff4e50" onclick="speakAr(${JSON.stringify(verb.past)});this.textContent='🔊';setTimeout(()=>this.textContent='🔈',1800)">🔈</button>
    </div>`;
  }
  html+='</div>';
  return html;
}

// GAME
// ══════════════════════════════════════════════════════════════════════════
function startGame(drill){
  isDrill=drill;
  deck = drill ? buildDrillDeck() : buildNormalDeck();
  if(deck.length===0){renderMenu();return;}
  deckIdx=0;flipped=false;
  showScreen("game");renderCard();
}
function startDrill(){
  if(failedVerbs().length===0)return;
  startGame(true);
}

function renderCard(){
  const el=document.getElementById("screen-game");
  if(deckIdx>=deck.length){renderGameDone();return;}
  const card=deck[deckIdx];
  const isAr=card.dir==="ar→en";
  const pct=(deckIdx/deck.length)*100;

  let toastHtml="";
  if(isDrill){
    toastHtml=`<div style="margin-bottom:10px;padding:4px 14px;border-radius:20px;font-size:12px;letter-spacing:1px;border:1px solid #f87171;color:#f87171;text-transform:uppercase;display:inline-block">🔥 Mode errors</div>`;
  }

  const frontHtml = isAr
    ? arabicBlock(card.verb)
    : `<div style="text-align:center"><p style="font-size:34px;margin:0;font-style:italic;line-height:1.3">${card.verb.en}</p></div>`;

  const backHtml = flipped
    ? (isAr
        ? `<div style="margin-top:20px;border-top:2px solid #2a2a2a;padding-top:18px;text-align:center"><p style="font-size:32px;margin:0;color:#f9d423;font-style:italic">${card.verb.en}</p></div>`
        : `<div style="margin-top:24px;border-top:2px solid #2a2a2a;padding-top:22px">${arabicBlock(card.verb,"#f9d423")}</div>`)
    : `<p style="color:#555;font-size:15px;text-align:center;margin-top:20px">toca per veure ${isAr?"la traducció":"l'àrab"}</p>`;

  const btnsHtml = flipped
    ? `<div style="display:flex;gap:16px;margin-top:22px"><button class="btn-no" onclick="answer(false)">✗</button><button class="btn-yes" onclick="answer(true)">✓</button></div>`
    : `<div style="margin-top:24px;display:flex;gap:10px;justify-content:center">
        <div style="width:10px;height:10px;border-radius:50%;background:#444"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#f9d423;animation:pulse 1.5s infinite"></div>
        <div style="width:10px;height:10px;border-radius:50%;background:#444"></div>
       </div>`;

  el.innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div class="wrap" style="padding-left:0;padding-right:0">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <button onclick="showScreen('menu');renderMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>
        <div class="grad-bar" style="flex:1"><div class="grad-bar-fill" style="width:${pct}%"></div></div>
        <span style="color:#888;font-size:17px">${deckIdx+1}/${deck.length}</span>
      </div>
      <div style="text-align:center;margin-bottom:12px">${toastHtml}</div>
      <div class="card" onclick="flipCard()" style="cursor:${flipped?'default':'pointer'}">
        ${frontHtml}${backHtml}
      </div>
      ${btnsHtml}
    </div>
  </div>`;
}

function flipCard(){
  if(!flipped){flipped=true;renderCard();}
}

function answer(correct){
  const verb=deck[deckIdx].verb;
  let graduated=false;
  const e=stats[verb.en]||{fails:0,streak:0};
  if(isDrill){
    const newStreak=correct?e.streak+1:0;
    if(newStreak>=3){graduated=true;stats[verb.en]={fails:0,streak:0};}
    else stats[verb.en]={fails:correct?e.fails:e.fails+1,streak:newStreak};
  } else {
    stats[verb.en]={fails:correct?e.fails:e.fails+1,streak:correct?e.streak:0};
  }
  saveStats(stats);

  if(graduated){
    // brief flash
    const el=document.getElementById("screen-game");
    const toast=document.createElement("div");
    toast.textContent=`🎓 "${verb.en}" graduada!`;
    toast.style.cssText="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(74,222,128,.2);border:1px solid #4ade80;border-radius:20px;padding:10px 20px;color:#4ade80;font-size:14px;z-index:999;animation:popIn .3s ease";
    document.body.appendChild(toast);
    setTimeout(()=>toast.remove(),1500);
  }

  deckIdx++;
  flipped=false;
  if(deckIdx>=deck.length)renderGameDone();
  else renderCard();
}

function renderGameDone(){
  document.getElementById("screen-game").innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">

    <h2 style="font-size:32px;margin:16px 0 8px;color:#f9d423">Sessió completada!</h2>
    <p style="color:#aaa;font-size:18px">${deck.length} cartes fetes</p>

  </div>`;
}

function submitApiKey(){
  const inp = document.getElementById("api-key-input");
  const key = inp ? inp.value.trim() : "";
  if(!key.startsWith("sk-")){
    inp.style.border = "1px solid #f87171";
    inp.placeholder = "Ha de començar per sk-...";
    return;
  }
  saveApiKey(key);
  renderAIMenu();
}

async function callAI(system, user, history){
  const key = getApiKey();
  if(!key){ renderApiKeyScreen(); throw new Error("No API key"); }
  const msgs = history ? history : [{role:"user", content:user}];
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body:JSON.stringify({
      model:"claude-haiku-4-5-20251001",
      max_tokens:4096,
      system:system,
      messages:msgs
    })
  });
  if(resp.status===401){
    clearApiKey();
    renderApiKeyScreen();
    throw new Error("Clau invàlida. Comprova-la a console.anthropic.com");
  }
  const data = await resp.json();
  if(data.error){ throw new Error(data.error.message); }
  return data.content?.[0]?.text || "";
}

let fillChecked=false;
let chatHistory=[];
let aiContent=null;

function showAILoading(title){
  document.getElementById("screen-ai-activity").innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center">
    <div style="font-size:48px;animation:pulse 1s infinite">✨</div>
    <p style="color:#a78bfa;font-size:18px;margin-top:16px">Generant ${title}...</p>
  </div>`;
  showScreen("ai-activity");
}

async function startAIActivity(id){
  currentActivity=id;
  fillAnswers={};fillChecked=false;chatHistory=[];aiContent=null;
  const act=AI_ACTIVITIES.find(a=>a.id===id);
  showAILoading(act.title.toLowerCase());

  try{
    if(id==="story"){
      renderStoryMenu();
      return;

    }else if(id==="fill"){
      const txt=await callAI(
        `Ets un professor d'àrab. ${VOCAB_SHORT}
Genera 5 frases en àrab on un verb (conjugat en present o passat هو/هي) és substituït per _____.
Respon ÚNICAMENT en JSON sense cap text addicional ni backticks:
{"items":[{"ar":"frase amb _____","ca":"traducció indicant el temps verbal","answer":"verb correcte","options":["op1","op2","op3","op4"]}]}

VARIETAT: cada vegada barreja contextos molt diferents:
- Situacions: casa, feina, escola, viatge, mercat, hospital, restaurant, carrer, família, esport
- Temps verbals: alterna present i passat de manera impredictible
- Subjectes: ell, ella, persones amb noms àrabs variats
- Dificultat: barreja verbs simples (كتب، ذهب) amb verbs més complexos (استيقظ، اعتقد، استطاع)
- Que les 4 opcions siguin plausibles semànticament però solo una correcta gramaticalment o contextual.
IMPORTANT: escriu TOT l'àrab amb vocalització completa (tashkil). SEMPRE.`,
        "Genera 5 exercicis d'omplir buits."
      );
      aiContent=JSON.parse(txt.replace(/```json|```/g,"").trim());
      renderFill();

    }else if(id==="translate"){
      const txt=await callAI(
        `Ets un professor d'àrab. ${VOCAB_SHORT}
Genera 5 frases per traduir, alternant català→àrab i àrab→català de manera variada.
Respon ÚNICAMENT en JSON sense cap text addicional ni backticks:
{"items":[{"from":"frase original","to":"traducció correcta","dir":"ca→ar o ar→ca"}]}

VARIETAT MÀXIMA - cada vegada usa temes completament diferents:
- Contexts: família, viatge, menjar, salut, feina, escola, temps, compres, esport, emocions
- Tipus de frase: afirmativa, negativa, pregunta, exclamació
- Temps verbals: barreja present, passat i futur (سـ + present)
- Complexitat: de simples (Va al mercat) a compostes (Volia viatjar però estava malalt)
- Expressions útils: frases fetes, expressions de cortesia, opinions
IMPORTANT: escriu TOT l'àrab amb vocalització completa (tashkil). SEMPRE.`,
        "Genera 5 frases de traducció variades."
      );
      aiContent=JSON.parse(txt.replace(/```json|```/g,"").trim());
      renderTranslate();

    }else if(id==="chat"){
      const greeting=await callAI(
        `Ets un interlocutor àrab amable. ${VOCAB_CONTEXT}
Saluda l'estudiant en àrab, presenta't i fes una pregunta senzilla.
Format: línia en àrab \n (traducció al català entre parèntesis)`,
        "Inicia la conversa"
      );
      chatHistory=[{role:"assistant",text:greeting}];
      renderChat();

    }else if(id==="themed"){
      renderThemedMenu();
      return;
    }
  }catch(e){
    if(e.message === "No API key" || e.message === "Invalid API key") return;
    console.error("AI Error:", e);
    document.getElementById("screen-ai-activity").innerHTML=`
    <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
      <div style="color:#f87171;font-size:18px;text-align:center;margin-bottom:12px">Error connectant amb la IA</div>
      <div style="color:#666;font-size:13px;text-align:center;max-width:340px;word-break:break-all;margin-bottom:20px;font-family:monospace">${e.message}</div>
      <button onclick="startAIActivity(currentActivity)" style="margin-bottom:10px;padding:14px 28px;border-radius:14px;border:none;background:#7c3aed;color:#fff;font-size:16px;cursor:pointer">🔄 Tornar a intentar</button>
      <button onclick="clearApiKey();renderApiKeyScreen()" style="padding:10px 20px;border-radius:12px;border:1px solid #444;background:transparent;color:#888;font-size:14px;cursor:pointer">🔑 Canviar clau</button>
      <button onclick="showScreen('ai');renderAIMenu()" style="margin-top:8px;padding:10px 20px;border-radius:12px;border:none;background:transparent;color:#555;font-size:13px;cursor:pointer">← Tornar</button>
    </div>`;
  }
}

async function generateStory(themeId){
  currentStoryTheme = themeId;
  currentActivity = "story";
  showAILoading("conte");
  const seed = Math.floor(Math.random()*10000);
  const names = ["Khalid","Layla","Yusuf","Sara","Hassan","Nour","Mariam","Tariq","Zainab","Bilal","Rania","Samira","Karim","Lina","Jamal","Hana","Sami","Dina","Walid","Rana","Faris","Mona","Salma","Huda","Rim"];
  const shuffledNames = names.sort(()=>Math.random()-.5);
  const protagonist = shuffledNames[0];
  const secondary = shuffledNames[1];
  let themeInstruction;
  if(themeId === 'random'){
    const randomIdeas = [
      "Un malentès còmic entre dues persones que no parlen el mateix dialecte",
      "Algú es desperta en un lloc que no reconeix",
      "Un regal misteriós arriba sense remitent",
      "Una recepta secreta de l'àvia que ningú pot reproduir",
      "Un animal entra en un lloc inesperat",
      "Dues persones es troben després de molts anys",
      "Un examen amb una pregunta impossible",
      "Una tempesta que canvia els plans de tothom",
      "Un error al telèfon que porta a una aventura",
      "Una competició absurda entre veïns",
      "Un somni que es barreja amb la realitat",
      "Una carta antiga trobada dins d'un llibre",
      "Un viatge en tren amb un company de seient estrany",
      "Un plat cuinat que causa una reacció inesperada",
      "Una visita al metge amb un diagnòstic sorprenent",
      "Un primer dia de feina desastrós",
      "Una festa on tot surt malament",
      "Un secret de família revelat per accident",
      "Una aposta entre amics amb conseqüències inesperades",
      "Un objecte perdut que apareix en el lloc més absurd",
    ];
    const idea = randomIdeas[Math.floor(Math.random()*randomIdeas.length)];
    themeInstruction = `TEMA: Inventa un conte ORIGINAL i CREATIU. Inspiració (NO la copiïs literalment, usa-la com a punt de partida): "${idea}". Seed: ${seed}. Barreja elements de categories diferents del vocabulari.`;
  } else {
    const theme = STORY_THEMES.find(t=>t.id===themeId);
    themeInstruction = `TEMA OBLIGATORI: ${theme.emoji} ${theme.label} — ${theme.desc}. Usa principalment vocabulari de: ${theme.vocab}. Seed: ${seed}.`;
  }
  try{
    const txt = await callAI(
      `Ets un professor d'àrab creatiu. ${VOCAB_SHORT}
Escriu un conte de 4-5 frases en àrab MSA. Vocabulari conegut + màx 1 paraula nova per frase.
${themeInstruction}
Protagonista: ${protagonist}. Personatge secundari: ${secondary}.
REGLES IMPORTANTS:
- NO escriguis MAI sobre taxis, ni sobre conductors de taxi. PROHIBIT.
- El conte ha de ser ÚNIC i DIFERENT cada vegada. Seed aleatòria: ${seed}.
- Final: MAI feliç previsible. Pot ser: sorprenent, ambigu, còmic, trist, irònic, absurd.
- Fes servir TOTS els temps verbals que coneixes: present, passat, futur (سـ), imperatiu.
Respon NOMÉS en JSON sense backticks:
{"theme":"tema del conte en català","sentences":[{"ar":"frase","ca":"traducció","words":[{"ar":"mot","ca":"trad"},...]}]}
Totes les paraules de cada frase han d'aparèixer a "words" en ordre.
IMPORTANT: escriu TOT l'àrab amb vocalització completa (tashkil): fatha َ kasra ِ damma ُ shadda ّ sukun ْ. Sense excepció.`,
      `Genera un conte curt. Seed: ${seed}. Protagonista: ${protagonist}.`
    );
    aiContent = JSON.parse(txt.replace(/```json|```/g,"").trim());
    renderStory();
  }catch(e){
    if(e.message === "No API key" || e.message === "Invalid API key") return;
    document.getElementById("screen-ai-activity").innerHTML=`
    <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
      <div style="color:#f87171;font-size:18px;text-align:center;margin-bottom:12px">Error generant el conte</div>
      <div style="color:#666;font-size:13px;text-align:center;max-width:340px;word-break:break-all;margin-bottom:20px;font-family:monospace">${e.message}</div>
      <button onclick="generateStory('${themeId}')" style="margin-bottom:10px;padding:14px 28px;border-radius:14px;border:none;background:#7c3aed;color:#fff;font-size:16px;cursor:pointer">🔄 Tornar a intentar</button>
      <button onclick="renderStoryMenu()" style="padding:10px 20px;border-radius:12px;border:1px solid #444;background:transparent;color:#888;font-size:14px;cursor:pointer">← Tornar als temes</button>
    </div>`;
  }
}

function renderStory(){
  if(!aiContent||!aiContent.sentences){return;}

  // Build sentence rows with clickable words
  const rows = aiContent.sentences.map((s,i) => {
    let wordsHtml = "";
    if(s.words && s.words.length > 0){
      wordsHtml = s.words.map(w => {
        const wid = "w_" + Math.random().toString(36).slice(2);
        if(!window._tips) window._tips = {};
        window._tips[wid] = w.ca;
        return '<span class="ar-word" id="' + wid + '" onclick="toggleWordTip(\'' + wid + '\')">' +
               '<span class="ar-word-text">' + w.ar + '</span>' +
               '<span class="ar-word-tip">' + w.ca + '</span></span>';
      }).join(" ");;
    } else {
      wordsHtml = `<span class="ar" style="font-size:36px;color:#fff;line-height:1.8">${s.ar}</span>`;
    }
    return `<p style="line-height:2.4;text-align:right;direction:rtl;margin-bottom:8px">${wordsHtml}</p>`;
  }).join("");

  const fullTrans = aiContent.sentences.map((s,i) =>
    `<p style="color:#aaa;font-size:15px;margin:0 0 6px;line-height:1.6">${i+1}. ${s.ca}</p>`
  ).join("");

  const theme = aiContent.theme ? `<div style="font-size:12px;color:#666;text-align:center;margin-bottom:12px;letter-spacing:1px">Tema: ${aiContent.theme}</div>` : "";

  document.getElementById("screen-ai-activity").innerHTML=`
  <style>
    .ar-word{position:relative;display:inline-block;cursor:pointer;margin:0 3px}
    .ar-word-text{font-family:Arial,sans-serif;font-size:36px;color:#fff;border-bottom:1px dotted rgba(167,139,250,.5);padding-bottom:1px}
    .ar-word:hover .ar-word-text,.ar-word.open .ar-word-text{color:#c4b5fd;border-bottom-color:#a78bfa}
    .ar-word-tip{display:none;position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:#1e1b4b;border:1px solid #7c3aed;border-radius:8px;padding:6px 14px;font-size:16px;color:#c4b5fd;white-space:nowrap;pointer-events:none;z-index:100;direction:ltr;font-family:Georgia,serif;box-shadow:0 4px 16px rgba(0,0,0,.6)}
    .ar-word.open .ar-word-tip{display:block}
  </style>
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div style="max-width:580px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
        <button onclick="renderStoryMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>
        <h2 style="font-size:20px;color:#a78bfa">📖 Conte generat</h2>
        <button onclick="generateStory(currentStoryTheme||'random')" style="margin-left:auto;padding:8px 14px;border-radius:12px;border:1px solid rgba(167,139,250,.4);background:rgba(167,139,250,.1);color:#a78bfa;font-size:13px;cursor:pointer">🔄 Nou</button>
      </div>
      ${theme}
      <p style="color:#555;font-size:12px;text-align:center;margin-bottom:14px">💡 Clica cada paraula per veure la traducció</p>
      <div style="background:rgba(255,255,255,.05);border:1px solid rgba(167,139,250,.2);border-radius:20px;padding:24px 20px;margin-bottom:16px">
        ${rows}
      </div>
      <div style="background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.25);border-radius:16px;padding:18px 20px">
        <div style="font-size:11px;color:#a78bfa;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">📖 Traducció completa</div>
        ${fullTrans}
      </div>
    </div>
  </div>`;
}

function toggleWordTip(id){
  const el = document.getElementById(id);
  if(!el) return;
  const isOpen = el.classList.contains("open");
  document.querySelectorAll(".ar-word.open").forEach(w => w.classList.remove("open"));
  if(!isOpen) el.classList.add("open");
}


function renderFill(){
  if(!aiContent||!aiContent.items)return;
  const rows=aiContent.items.map((item,i)=>{
    const chosen=fillAnswers[i];
    const isCorrect=chosen===item.answer;
    const borderColor=fillChecked?(isCorrect?"rgba(74,222,128,.4)":"rgba(248,113,113,.4)"):"rgba(167,139,250,.2)";
    const opts=item.options.map(opt=>{
      let bg="rgba(255,255,255,.05)",border="1px solid #444",color="#aaa";
      if(chosen===opt){bg="rgba(167,139,250,.2)";border="1px solid #a78bfa";color="#a78bfa";}
      if(fillChecked&&opt===item.answer){bg="rgba(74,222,128,.15)";border="1px solid #4ade80";color="#4ade80";}
      if(fillChecked&&chosen===opt&&chosen!==item.answer){bg="rgba(248,113,113,.15)";border="1px solid #f87171";color="#f87171";}
      return `<button onclick="${fillChecked?"":`selectFill(${i},'${opt.replace(/'/g,"\'")}')`}" style="padding:8px 14px;border-radius:10px;border:${border};background:${bg};color:${color};font-family:Arial,sans-serif;font-size:18px;cursor:${fillChecked?"default":"pointer"};direction:rtl">${opt}</button>`;
    }).join("");
    return `<div style="background:rgba(255,255,255,.05);border:1px solid ${borderColor};border-radius:16px;padding:16px 18px">
      <div class="ar" style="font-size:22px;color:#fff;margin-bottom:6px;line-height:1.6">${item.ar}</div>
      <div style="color:#888;font-size:13px;margin-bottom:12px;font-style:italic">${item.ca}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${opts}</div>
    </div>`;
  }).join("");

  const correctCount=Object.entries(fillAnswers).filter(([i,v])=>v===aiContent.items[i].answer).length;
  const checkBtn=fillChecked
    ? `<div style="text-align:center;padding:16px;border-radius:16px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3)"><span style="font-size:24px;color:#a78bfa">${correctCount} / ${aiContent.items.length} correctes</span></div>`
    : `<button onclick="checkFill()" style="padding:16px;border-radius:16px;border:none;background:linear-gradient(90deg,#7c3aed,#ec4899);color:#fff;font-weight:700;font-size:18px;cursor:pointer;width:100%">Comprovar respostes</button>`;

  document.getElementById("screen-ai-activity").innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div style="max-width:580px;margin:0 auto">
      ${aiHeader("✏️ Omple els buits")}
      <div style="display:flex;flex-direction:column;gap:16px">
        ${rows}
        ${checkBtn}
      </div>
    </div>
  </div>`;
}

function selectFill(i, opt){
  fillAnswers[i]=opt;
  renderFill();
}
function checkFill(){
  fillChecked=true;
  renderFill();
}

// ── TRANSLATE ──
let translateRevealed={};
function renderTranslate(){
  if(!aiContent||!aiContent.items)return;
  const rows=aiContent.items.map((item,i)=>{
    const isAr=item.dir==="ar→ca";
    const revealed=translateRevealed[i];
    const fromHtml=isAr
      ? `<div class="ar" style="font-size:26px;color:#fff;line-height:1.5">${item.from}</div>`
      : `<div style="font-size:18px;color:#fff;line-height:1.5;font-style:italic">${item.from}</div>`;
    const toHtml=revealed
      ? (isAr
          ? `<div style="font-size:16px;color:#f9d423;font-style:italic;margin-top:4px">${item.to}</div>`
          : `<div class="ar" style="font-size:26px;color:#f9d423;line-height:1.5;margin-top:4px">${item.to}
              <button onclick="speakAr(${JSON.stringify(item.to)});this.textContent='🔊';setTimeout(()=>this.textContent='🔈',1800)" style="background:none;border:none;color:#a78bfa;font-size:16px;cursor:pointer">🔈</button>
             </div>`)

function setChatInput(text){
  const inp=document.getElementById("chat-input");
  if(inp)inp.value=text;
}

async function sendChat(){
  const inp=document.getElementById("chat-input");
  if(!inp||!inp.value.trim())return;
  const userText=inp.value.trim();
  chatHistory.push({role:"assistant",text:""});// placeholder
  chatHistory.pop();
  chatHistory.push({role:"user",text:userText});
  renderChat(); // show user message + loading

  const histForAI=chatHistory.map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.text}));
  try{
    const reply=await callAI(
      `Ets un interlocutor àrab amable, pacient i variat. ${VOCAB_CONTEXT}
Conversa en àrab usant vocabulari conegut. Si l'estudiant comet errors, corregeix-los breument i continua.
Format: primera línia en àrab, segona línia traducció al català. Si cal: 💡 Correcció: ...

VARIETAT: cada conversa tingues un rol diferent. Pots ser:
- Un amic àrab que explica el seu dia
- Un venedor al mercat
- Un metge a la consulta
- Un company de classe
- Un hoteler que rep turistes
- Un cuiner que explica una recepta
- Un viatger que demana informació
Introdueix-te breument al primer missatge i mantén el rol durant tota la conversa.
IMPORTANT: escriu TOT l'àrab amb vocalització completa (tashkil): fatha, kasra, damma, shadda, sukun. SEMPRE.`,
      null,
      histForAI
    );
    chatHistory.push({role:"assistant",text:reply});
  }catch(e){
    chatHistory.push({role:"assistant",text:"Error de connexió. Torna-ho a intentar."});
  }
  renderChat();
}

async function startThemedChat(themeId){
  let theme;
  if(themeId === 'random'){
    theme = CONVERSATION_THEMES[Math.floor(Math.random() * CONVERSATION_THEMES.length)];
  } else {
    theme = CONVERSATION_THEMES.find(t => t.id === themeId);
  }
  if(!theme) return;

  chatHistory = [];
  currentActivity = "themed_" + theme.id;
  showAILoading("conversa temàtica");

  const systemPrompt = `Ets un parlant natiu d'àrab en una conversa temàtica amb un estudiant. ${VOCAB_CONTEXT}

TEMA: ${theme.label} (${theme.unit})
SITUACIÓ: ${theme.desc}

ROL: Inicia tu la conversa de manera natural en àrab, presentant-te en el rol adequat (venedor, metge, company...).
REGLES:
- Usa vocabulari del nivell de l'estudiant (A2-B1)
- Frases curtes i clares
- Si l'estudiant comet errors, corregeix-los breument i continua
- Mantén el tema fins que l'estudiant vulgui acabar
- IMPORTANT: escriu TOT l'àrab amb vocalització completa (tashkil)
Format de cada missatge: primera línia en àrab, segona línia traducció al català entre parèntesis. Si cal: 💡 Correcció: ...`;

  try {
    const greeting = await callAI(systemPrompt, "Inicia la conversa temàtica");
    chatHistory = [{role:"assistant", text:greeting}];
    renderThemedChat(theme, systemPrompt);
  } catch(e) {
    if(e.message === "No API key" || e.message === "Invalid API key") return;
    document.getElementById("screen-ai-activity").innerHTML = `
    <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
      <div style="color:#f87171;font-size:18px;text-align:center;margin-bottom:16px">Error: ${e.message}</div>
      <button onclick="renderThemedMenu()" style="padding:14px 28px;border-radius:14px;border:none;background:#7c3aed;color:#fff;cursor:pointer">← Tornar</button>
    </div>`;
  }
}

    const isAI = m.role === "assistant";

function setThemedInput(text){
  const inp = document.getElementById('themed-input');
  if(inp) inp.value = text;
}

async function sendThemedChat(themeId, sysPrompt){
  const inp = document.getElementById('themed-input');
  if(!inp || !inp.value.trim()) return;
  const userText = inp.value.trim();
  inp.value = '';
  chatHistory.push({role:"user", text:userText});

  const theme = CONVERSATION_THEMES.find(t => t.id === themeId) || CONVERSATION_THEMES[0];
  const systemPrompt = window.themedSystemPrompt || sysPrompt;

  // Re-render with loading indicator
  const histForAI = chatHistory.map(m => ({role: m.role === "assistant" ? "assistant" : "user", content: m.text}));

  try {
    const reply = await callAI(systemPrompt, null, histForAI);
    chatHistory.push({role:"assistant", text:reply});
  } catch(e) {
    if(e.message === "No API key" || e.message === "Invalid API key") return;
    chatHistory.push({role:"assistant", text:"Error: " + e.message});
  }
  renderThemedChat(theme, systemPrompt);
}

function toggleArabicKb(){
  const kb = document.getElementById('arabic-kb');
  const btn = document.getElementById('kb-toggle');
  if(!kb) return;
  const isOpen = kb.style.display !== 'none';
  kb.style.display = isOpen ? 'none' : 'block';
  if(btn) btn.style.background = isOpen ? 'rgba(167,139,250,.1)' : 'rgba(167,139,250,.25)';
}
function insertChar(ch){
  const inp = document.getElementById('chat-input') || document.getElementById('themed-input');
  if(!inp) return;
  const s = inp.selectionStart, e = inp.selectionEnd;
  inp.value = inp.value.slice(0,s) + ch + inp.value.slice(e);
  inp.selectionStart = inp.selectionEnd = s + ch.length;
  inp.focus();
}
function deleteChar(){
  const inp = document.getElementById('chat-input') || document.getElementById('themed-input');
  if(!inp || inp.selectionStart === 0) return;
  const s = inp.selectionStart;
  inp.value = inp.value.slice(0,s-1) + inp.value.slice(s);
  inp.selectionStart = inp.selectionEnd = s-1;
  inp.focus();
}

function getSynPool(){
  if(synMode==='syn') return synAntData.synonyms.map(p=>({...p,type:'syn'}));
  if(synMode==='ant') return synAntData.antonyms.map(p=>({...p,type:'ant'}));
  return [
    ...synAntData.synonyms.map(p=>({...p,type:'syn'})),
    ...synAntData.antonyms.map(p=>({...p,type:'ant'}))
  ];
}

function startSynGame(){
  const pool = shuffle(getSynPool());
  const deck = pool.map(pair => {
    const showFirst = Math.random()>.5;
    const question = showFirst ? pair.ar1 : pair.ar2;
    const answer = showFirst ? pair.ar2 : pair.ar1;
    const answerCa = showFirst ? pair.ca2 : pair.ca1;
    // Generate 3 wrong options from same type
    const sameType = pair.type==='syn' ? synAntData.synonyms : synAntData.antonyms;
    const wrongs = shuffle(sameType.filter(p=>p.ar1!==pair.ar1))
      .slice(0,3)
      .map(p=>Math.random()>.5?p.ar1:p.ar2);
    const options = shuffle([answer, ...wrongs]);
    return {question, answer, answerCa, type:pair.type, en:pair.en, options, questionCa:showFirst?pair.ca1:pair.ca2};
  });
  synGameState = {deck, idx:0, score:0, total:deck.length, answered:false, selectedOpt:null};
  renderSynGame();
}

      </div>
      <button onclick="nextSynCard()" style="margin-top:14px;width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(90deg,#10b981,#06b6d4);color:#0f0c29;font-weight:700;font-size:18px;cursor:pointer">${gs.idx+1>=gs.total?'Veure resultats':'Següent →'}</button>`
    :`<button onclick="checkSynAnswer()" style="margin-top:14px;width:100%;padding:16px;border-radius:16px;border:none;background:linear-gradient(90deg,#10b981,#06b6d4);color:#0f0c29;font-weight:700;font-size:18px;cursor:pointer;opacity:${gs.selectedOpt?1:0.4}">Comprovar</button>`;

  el.innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div style="max-width:520px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <button onclick="renderSynMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>
        <div class="grad-bar" style="flex:1"><div style="height:100%;background:linear-gradient(90deg,#10b981,#06b6d4);border-radius:4px;transition:width .3s;width:${pct}%"></div></div>
        <span style="color:#888;font-size:17px">${gs.idx+1}/${gs.total}</span>
      </div>
      <div style="text-align:center;margin-bottom:12px">
        <span style="font-size:12px;letter-spacing:1px;border:1px solid ${typeColor};color:${typeColor};border-radius:20px;padding:4px 14px">${typeLabel}</span>
      </div>
      <div class="card" style="border-color:rgba(16,185,129,.2)">
        <div style="text-align:center;margin-bottom:16px">
          <div class="ar" style="font-size:46px;color:#fff;line-height:1.4;margin-bottom:6px">${card.question}</div>
          <div style="font-size:14px;color:#666;font-style:italic">${card.questionCa}</div>
          <button onclick="speakAr('${card.question.replace(/'/g,"\\'")}')" style="margin-top:6px;background:none;border:none;font-size:18px;cursor:pointer;color:#10b981">🔈</button>
        </div>
        <div style="font-size:15px;color:#aaa;text-align:center;margin-bottom:16px">${questionText}</div>
        <div style="display:flex;flex-direction:column;gap:10px">${optsHtml}</div>
        ${feedbackHtml}
      </div>
      <div style="text-align:center;margin-top:12px;color:#555;font-size:14px">Puntuació: ${gs.score}/${gs.idx}</div>
    </div>
  </div>`;
}

function selectSynOpt(opt){
  if(!synGameState||synGameState.answered)return;
  synGameState.selectedOpt=opt;
  renderSynGame();
}
function checkSynAnswer(){
  if(!synGameState||!synGameState.selectedOpt)return;
  synGameState.answered=true;
  if(synGameState.selectedOpt===synGameState.deck[synGameState.idx].answer)synGameState.score++;
  renderSynGame();
}
function nextSynCard(){
  synGameState.idx++;
  synGameState.answered=false;
  synGameState.selectedOpt=null;
  renderSynGame();
}
function renderSynGameDone(){
  const gs=synGameState;
  const pct=Math.round((gs.score/gs.total)*100);
  const emoji=pct>=80?'🏆':pct>=60?'👍':pct>=40?'💪':'📚';
  document.getElementById("screen-syn").innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px">
    <div style="font-size:72px">${emoji}</div>
    <h2 style="font-size:32px;margin:16px 0 8px;background:linear-gradient(90deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${gs.score} / ${gs.total}</h2>
    <p style="color:#aaa;font-size:18px">${pct}% correctes</p>
    <div style="display:flex;gap:12px;margin-top:28px">
      <button onclick="startSynGame()" style="padding:16px 28px;border-radius:16px;border:none;background:linear-gradient(90deg,#10b981,#06b6d4);color:#0f0c29;font-weight:700;font-size:16px;cursor:pointer">🔄 Repetir</button>
      <button onclick="renderSynMenu()" style="padding:16px 28px;border-radius:16px;border:2px solid #444;background:transparent;color:#888;font-size:16px;cursor:pointer">← Menú</button>
    </div>
  </div>`;
}

// ── SYNONYM/ANTONYM LIST ─────────────────────────────────────────────────
function renderSynList(){
  const el=document.getElementById("screen-syn");
  const pool=getSynPool();
  const filtered=pool.filter(p=>{
    if(!synSearch)return true;
    const s=synSearch.toLowerCase();
    return p.ar1.includes(synSearch)||p.ar2.includes(synSearch)||p.ca1.toLowerCase().includes(s)||p.ca2.toLowerCase().includes(s)||p.en.toLowerCase().includes(s);
  });

  const syns=filtered.filter(p=>p.type==='syn');
  const ants=filtered.filter(p=>p.type==='ant');

  function pairCard(p){
    const color=p.type==='syn'?'#06b6d4':'#f59e0b';
    const borderColor=p.type==='syn'?'rgba(6,182,212,.2)':'rgba(245,158,11,.2)';
    const symbol=p.type==='syn'?'=':'≠';
    return `<div style="background:rgba(255,255,255,.04);border:1px solid ${borderColor};border-radius:16px;padding:14px 16px">
      <div style="display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap">
        <div style="text-align:center;flex:1;min-width:100px">
          <div class="ar" style="font-size:28px;color:#fff;line-height:1.4">${p.ar1}</div>
          <div style="font-size:13px;color:#888;margin-top:2px">${p.ca1}</div>
          <button onclick="speakAr('${p.ar1.replace(/'/g,"\\'")}')" style="background:none;border:none;color:${color};font-size:14px;cursor:pointer;margin-top:2px">🔈</button>
        </div>
        <div style="font-size:28px;color:${color};font-weight:700">${symbol}</div>
        <div style="text-align:center;flex:1;min-width:100px">
          <div class="ar" style="font-size:28px;color:#fff;line-height:1.4">${p.ar2}</div>
          <div style="font-size:13px;color:#888;margin-top:2px">${p.ca2}</div>
          <button onclick="speakAr('${p.ar2.replace(/'/g,"\\'")}')" style="background:none;border:none;color:${color};font-size:14px;cursor:pointer;margin-top:2px">🔈</button>
        </div>
      </div>
    </div>`;
  }

  let content='';
  if(synMode!=='ant'&&syns.length>0){
    content+=`<div style="font-size:12px;letter-spacing:2px;color:#06b6d4;text-transform:uppercase;margin:16px 0 10px">مُرَادِف · Sinònims (${syns.length})</div>`;
    content+=syns.map(pairCard).join("");
  }
  if(synMode!=='syn'&&ants.length>0){
    content+=`<div style="font-size:12px;letter-spacing:2px;color:#f59e0b;text-transform:uppercase;margin:16px 0 10px">ضِدّ · Antònims (${ants.length})</div>`;
    content+=ants.map(pairCard).join("");
  }

  el.innerHTML=`
  <div style="min-height:100vh;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);padding:24px 16px">
    <div style="max-width:640px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
        <button onclick="renderSynMenu()" style="background:none;border:none;color:#888;font-size:28px;cursor:pointer">←</button>
        <h2 style="font-size:22px;background:linear-gradient(90deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Llista d'estudi</h2>
      </div>
      <input type="text" value="${synSearch}" oninput="synSearch=this.value;renderSynList()" placeholder="Cerca..." style="width:100%;padding:11px 14px;border-radius:12px;border:1px solid #444;background:rgba(255,255,255,.06);color:#fff;font-size:16px;margin-bottom:6px">
      <div style="display:flex;flex-direction:column;gap:10px">${content}</div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════════════
// Preload voices
if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.addEventListener("voiceschanged",()=>window.speechSynthesis.getVoices());
}
renderMenu();
</script>
</body>
</html>
